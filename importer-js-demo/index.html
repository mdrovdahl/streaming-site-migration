<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Import Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; }

    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }

    .controls {
      background: #313244; border-radius: 8px; padding: 16px; margin-bottom: 16px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input {
      background: #1e1e2e; border: 1px solid #45475a; border-radius: 4px;
      color: #cdd6f4; padding: 8px 12px; font-size: 14px; font-family: monospace;
      width: 100%;
    }
    .field input:focus { outline: none; border-color: #89b4fa; }
    .controls-actions {
      grid-column: 1 / -1;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .controls-options {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }
    .proxy-toggle {
      display: flex; gap: 6px; align-items: center; cursor: pointer;
      font-size: 14px; color: #cdd6f4; min-width: 0;
    }
    .proxy-toggle span { overflow-wrap: anywhere; }

    button {
      background: #89b4fa; color: #1e1e2e; border: none; border-radius: 4px;
      padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      height: 36px; white-space: nowrap;
    }
    button:hover { background: #74c7ec; }
    button:disabled { background: #45475a; color: #6c7086; cursor: not-allowed; }
    button.cancel { background: #f38ba8; }
    button.cancel:hover { background: #eba0ac; }
    button.icon-button {
      width: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      background: #45475a; color: #cdd6f4;
    }
    button.icon-button:hover { background: #585b70; }
    button.icon-button.copied { background: #a6e3a1; color: #1e1e2e; }
    button.icon-button svg { width: 18px; height: 18px; }

    .status-bar {
      background: #313244; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
      display: none; gap: 16px; align-items: center;
    }
    .status-bar.visible { display: flex; }
    .phase-badge {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; white-space: nowrap; padding: 0;
      background: transparent; border-radius: 0;
    }
    .phase-badge.active { color: #89b4fa; }
    .phase-badge.done { color: #a6e3a1; }
    .phase-badge.error { color: #f38ba8; }
    .status-message { flex: 1; font-size: 14px; }
    .status-count { font-family: monospace; font-size: 13px; color: #a6adc8; }

    .log-accordion {
      background: #181825; border: 1px solid #313244; border-radius: 8px; margin-bottom: 16px;
    }
    .log-accordion summary {
      list-style: none; cursor: pointer; user-select: none; padding: 10px 12px;
      font-size: 12px; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .log-accordion summary::-webkit-details-marker { display: none; }
    .log-accordion summary::before {
      content: '▸'; display: inline-block; margin-right: 8px; transition: transform 120ms ease;
    }
    .log-accordion[open] summary::before { transform: rotate(90deg); }
    .log {
      border-top: 1px solid #313244; padding: 12px;
      max-height: 160px; overflow-y: auto; font-family: monospace; font-size: 12px;
      line-height: 1.6; display: none;
    }
    .log.visible { display: block; }
    .log .entry { color: #a6adc8; }
    .log .entry.error { color: #f38ba8; }
    .log .entry.success { color: #a6e3a1; }

    iframe {
      width: 100%; height: calc(100vh - 300px); min-height: 400px;
      border: 1px solid #45475a; border-radius: 8px; background: #fff;
    }

    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr; }
      .controls-options { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WordPress Playground Site Import</h1>

    <div class="controls">
      <div class="field">
        <label>Export API URL</label>
        <input id="url" type="text" placeholder="https://example.com/?site-export-api" />
      </div>
      <div class="field">
        <label>Connection Token</label>
        <div style="display:flex;gap:4px">
          <input id="secret" type="text" readonly style="cursor:default;color:#a6e3a1" />
          <button id="btn-copy-token" class="icon-button" type="button" aria-label="Copy connection token" title="Copy connection token">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        <span style="font-size:11px;color:#6c7086;margin-top:2px">Paste this into the export plugin on your source site</span>
      </div>
      <div class="controls-actions">
        <button id="btn-import" disabled>Loading Playground...</button>
        <button id="btn-cancel" class="cancel" style="display:none">Cancel</button>
        <button id="btn-admin" style="display:none;background:#cba6f7" disabled title="Open wp-admin with all plugins disabled">Safe Mode</button>
        <button id="btn-fullscreen" style="display:none;background:#a6e3a1">Full Screen</button>
        <button id="btn-delete" class="cancel" style="display:none">Delete Local Site</button>
        <div class="controls-options">
          <label class="proxy-toggle">
            <input id="skip-files" type="checkbox" checked />
            <span id="skip-files-label-text">Proxy media from source</span>
          </label>
        </div>
      </div>
    </div>

    <div id="status-bar" class="status-bar">
      <span id="phase-badge" class="phase-badge">-</span>
      <span id="status-message" class="status-message">-</span>
      <span id="status-count" class="status-count"></span>
      <span id="elapsed-time" class="status-count" style="display:none"></span>
    </div>

    <details id="log-accordion" class="log-accordion">
      <summary>Activity Log</summary>
      <div id="log" class="log"></div>
    </details>

    <iframe id="playground"></iframe>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
